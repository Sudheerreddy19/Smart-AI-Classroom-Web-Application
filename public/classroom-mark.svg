<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Mortarboard cap top (flat square) -->
  <polygon points="16,4 30,11 16,18 2,11" fill="#2563eb"/>
  <!-- Cap brim shadow line -->
  <polygon points="16,18 2,11 2,13 16,20" fill="#1d4ed8"/>
  <polygon points="16,18 30,11 30,13 16,20" fill="#1e40af"/>
  <!-- Diploma scroll body -->
  <rect x="9" y="20" width="14" height="9" rx="1.5" fill="#2563eb"/>
  <!-- Scroll end caps -->
  <ellipse cx="9" cy="24.5" rx="1.5" ry="4.5" fill="#1d4ed8"/>
  <ellipse cx="23" cy="24.5" rx="1.5" ry="4.5" fill="#1d4ed8"/>
  <!-- Scroll ribbon -->
  <rect x="9" y="23.5" width="14" height="2" fill="#1e40af"/>
  <!-- Tassel cord (right side) -->
  <line x1="30" y1="11" x2="30" y2="17" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tassel end -->
  <circle cx="30" cy="18" r="1.5" fill="#1d4ed8"/>
  <line x1="28.5" y1="19.5" x2="28" y2="23" stroke="#1d4ed8" stroke-width="1" stroke-linecap="round"/>
  <line x1="30" y1="19.5" x2="30" y2="23" stroke="#1d4ed8" stroke-width="1" stroke-linecap="round"/>
  <line x1="31.5" y1="19.5" x2="32" y2="23" stroke="#1d4ed8" stroke-width="1" stroke-linecap="round"/>
</svg>